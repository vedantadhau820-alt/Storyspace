<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Alien Attack - STORYSPACE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#f5f5f5;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

/* =========================================
   NAVBAR
========================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:22px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;

    background:rgba(5,5,5,0.75);
    backdrop-filter:blur(10px);

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:3px;
}

.back-btn{
    color:#8c8c8c;
    text-decoration:none;
    font-size:0.7rem;
    letter-spacing:2px;
    transition:0.4s;
}

.back-btn:hover{
    color:white;
}

/* =========================================
   HERO
========================================= */

.story-hero{
    height:75vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 7%;
}

.story-hero::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(to bottom,
    rgba(5,5,5,0.4),
    rgba(5,5,5,0.95)),

    url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1974&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    z-index:-1;
}

.story-hero-content{
    max-width:700px;
}

.story-tag{
    color:#9d8254;
    letter-spacing:4px;
    font-size:0.7rem;
    margin-bottom:18px;
}

.story-hero h1{
    font-size:4rem;
    font-weight:500;
    line-height:1;
}

.story-hero p{
    margin-top:20px;
    color:#a0a0a0;
    line-height:1.9;
    font-size:0.85rem;
}

/* =========================================
   STORY CONTENT
========================================= */

.story-container{
    max-width:750px;
    margin:auto;
    padding:100px 7%;
}

.story-container h2{
    font-size:1.5rem;
    margin-bottom:24px;
    font-weight:500;
}

.story-container p{
    color:#9a9a9a;
    line-height:2.1;
    font-size:0.88rem;
    margin-bottom:28px;
}

/* =========================================
   QUOTE
========================================= */

.story-quote{
    margin:60px 0;
    padding-left:24px;
    border-left:1px solid rgba(255,255,255,0.15);
}

.story-quote p{
    font-size:1rem;
    color:#d7d7d7;
    line-height:1.9;
}

/* =========================================
   NEXT STORY
========================================= */

.next-story{
    margin-top:90px;
    padding-top:40px;
    border-top:1px solid rgba(255,255,255,0.06);
}

.next-story a{
    display:inline-block;
    margin-top:18px;
    color:#9d8254;
    text-decoration:none;
    letter-spacing:2px;
    font-size:0.72rem;
}

/* =========================================
   REVEAL
========================================= */

.reveal{
    opacity:0;
    transform:translateY(25px);
    transition:1s ease;
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

.story-hero h1{
    font-size:2.6rem;
}

.story-container{
    padding-top:70px;
}

}

.story-container{
    user-select:none;
    -webkit-user-select:none;
}



</style>
</head>

<body>

<!-- =========================================
NAVBAR
========================================= -->

<nav>

<div class="logo">
STORYSPACE
</div>

<a href="../index.html" class="back-btn">
BACK
</a>

</nav>

<!-- =========================================
HERO
========================================= -->

<section class="story-hero">

<div class="story-hero-content reveal">

<div class="story-tag">
SCI-FI • FEATURED STORY
</div>

<h1>
The Alien Attack
</h1>

<div class="story-tag" style="margin-top: 20px;">
A STORY BY THEWRITER
</div>


</div>

</section>

<!-- =========================================
STORY CONTENT
========================================= -->

<div class="story-container">

<div class="reveal">

<h2>
Chapter One
</h2>

<p>
Coming Soon...
</p>

</div>


<div class="next-story reveal">

<h2>
Continue Reading
</h2>

<a href="#">
NEXT CHAPTER IN PROGRESS
</a>

</div>

</div>

<script>

/* =========================================
   REVEAL
========================================= */

const reveals = document.querySelectorAll(".reveal");

function revealElements(){

    reveals.forEach((element)=>{

        const windowHeight = window.innerHeight;

        const revealTop = element.getBoundingClientRect().top;

        if(revealTop < windowHeight - 80){
            element.classList.add("active");
        }

    })

}

document.addEventListener("contextmenu",(e)=>{
    e.preventDefault();
})

document.addEventListener("keydown",(e)=>{

    if(
        (e.ctrlKey && e.key === "c") ||
        (e.ctrlKey && e.key === "u") ||
        (e.ctrlKey && e.key === "s") ||
        (e.ctrlKey && e.key === "a")
    ){

        e.preventDefault();

    }

})

window.addEventListener("scroll",revealElements);

revealElements();

</script>

</body>
</html>
